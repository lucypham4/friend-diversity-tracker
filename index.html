<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friend Diversity Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #0f1419;
            color: #d4d8dd;
            min-height: 100vh;
            padding: 0;
        }

        .header {
            background: #1a1f29;
            border-bottom: 1px solid #2d3544;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 500;
            color: #e8ecf1;
            letter-spacing: 0.3px;
        }

        .header-right {
            font-size: 12px;
            color: #8a92a3;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 24px;
            height: calc(100vh - 57px);
        }

        .panel {
            background: #1a1f29;
            border: 1px solid #2d3544;
            border-radius: 3px;
            overflow: hidden;
        }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid #2d3544;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 600;
            color: #e8ecf1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .panel-content {
            padding: 20px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #141821;
            border: 1px solid #2d3544;
            border-radius: 3px;
            padding: 16px;
        }

        .stat-label {
            font-size: 11px;
            color: #8a92a3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 300;
            color: #e8ecf1;
        }

        .stat-change {
            font-size: 11px;
            margin-top: 4px;
        }

        .stat-change.positive {
            color: #2fb17a;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-label {
            font-size: 11px;
            color: #8a92a3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        input, select {
            background: #141821;
            border: 1px solid #2d3544;
            border-radius: 3px;
            color: #e8ecf1;
            padding: 10px 12px;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #0099ff;
            background: #1a1f29;
        }

        input::placeholder {
            color: #5a6270;
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #1a1f29;
            color: #e8ecf1;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: inherit;
        }

        .btn-primary {
            background: #0099ff;
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: #0088ee;
        }

        .btn-primary:active {
            background: #0077dd;
        }

        .btn-secondary {
            background: transparent;
            color: #8a92a3;
            border: 1px solid #2d3544;
            padding: 8px 12px;
            font-size: 11px;
        }

        .btn-secondary:hover {
            background: #141821;
            border-color: #3d4554;
        }

        .btn-danger {
            background: transparent;
            color: #f55656;
            border: 1px solid #4d2d2d;
            padding: 6px 10px;
            font-size: 11px;
        }

        .btn-danger:hover {
            background: #2a1616;
            border-color: #6d3d3d;
        }

        .multiracial-component {
            display: grid;
            grid-template-columns: 1fr 80px auto;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .multiracial-component select {
            font-size: 12px;
        }

        .multiracial-component input {
            font-size: 12px;
            text-align: center;
        }

        .btn-remove-component {
            background: transparent;
            color: #f55656;
            border: 1px solid #4d2d2d;
            padding: 8px 10px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .btn-remove-component:hover {
            background: #2a1616;
        }

        .btn-share {
            background: #2fb17a;
            color: white;
            width: 100%;
            margin-top: 16px;
        }

        .btn-share:hover {
            background: #28a06d;
        }

        .friends-list {
            max-height: calc(100vh - 500px);
            overflow-y: auto;
            margin-top: 20px;
        }

        .friends-list::-webkit-scrollbar {
            width: 8px;
        }

        .friends-list::-webkit-scrollbar-track {
            background: #141821;
        }

        .friends-list::-webkit-scrollbar-thumb {
            background: #2d3544;
            border-radius: 4px;
        }

        .friend-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #141821;
            border: 1px solid #2d3544;
            border-radius: 3px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .friend-item:hover {
            background: #1a1f29;
            border-color: #3d4554;
        }

        .friend-info {
            flex: 1;
        }

        .friend-name {
            font-size: 13px;
            color: #e8ecf1;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .friend-race {
            font-size: 11px;
            color: #8a92a3;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 20px;
        }

        .chart-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .distribution-table {
            margin-top: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .table-wrapper {
            overflow-x: auto;
            overflow-y: auto;
            flex: 1;
        }

        .table-wrapper::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: #141821;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: #2d3544;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 12px;
        }

        thead {
            background: #141821;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #8a92a3;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #2d3544;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #2d3544;
            color: #d4d8dd;
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #141821;
        }

        .percentage-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            background: #1a3a52;
            color: #5eb3ff;
        }

        .count-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            background: #1a2e1a;
            color: #6dd16d;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #5a6270;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state-text {
            font-size: 13px;
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo">F</div>
            <h1>Friend Network Analysis: Diversity Metrics</h1>
        </div>
        <div class="header-right">Updated: <span id="currentDate"></span></div>
    </div>

    <div class="container">
        <!-- Left Panel: Input & Friends List -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">Network Input</div>
            </div>
            <div class="panel-content">
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Contacts</div>
                        <div class="stat-value" id="totalFriends">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Unique Groups</div>
                        <div class="stat-value" id="uniqueGroups">0</div>
                    </div>
                </div>

                <div class="input-section">
                    <div class="input-group">
                        <div>
                            <div class="form-label">Contact Name</div>
                            <input type="text" id="friendName" placeholder="Enter name" />
                        </div>
                        <div>
                            <div class="form-label">Race / Ethnicity</div>
                            <select id="friendRace" onchange="handleRaceChange()">
                                <option value="">Select classification</option>
                                <option value="Asian">Asian</option>
                                <option value="Black/African American">Black/African American</option>
                                <option value="Hispanic/Latino">Hispanic/Latino</option>
                                <option value="White/Caucasian">White/Caucasian</option>
                                <option value="Middle Eastern/North African">Middle Eastern/North African</option>
                                <option value="Native American/Indigenous">Native American/Indigenous</option>
                                <option value="Pacific Islander">Pacific Islander</option>
                                <option value="Multiracial">Multiracial</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        
                        <div id="multiracialSection" style="display: none;">
                            <div class="form-label">Racial Composition</div>
                            <div id="multiracialInputs"></div>
                            <button class="btn btn-secondary" onclick="addRaceComponent()" style="margin-top: 8px; width: 100%;">+ Add Race Component</button>
                        </div>
                        
                        <button class="btn btn-primary" onclick="addFriend()">Add to Network</button>
                    </div>
                </div>

                <div class="friends-list" id="friendsList"></div>
            </div>
        </div>

        <!-- Right Panel: Visualization & Analytics -->
        <div class="panel chart-panel">
            <div class="panel-header">
                <div class="panel-title">Diversity Distribution Analysis</div>
                <button class="btn btn-secondary" onclick="shareChart()">Export</button>
            </div>
            <div class="panel-content" style="flex: 1; display: flex; flex-direction: column;">
                <div class="chart-container">
                    <canvas id="diversityChart"></canvas>
                </div>

                <div class="distribution-table">
                    <div class="table-wrapper">
                        <table id="distributionTable">
                            <thead>
                                <tr>
                                    <th>Classification</th>
                                    <th>Count</th>
                                    <th>Percentage</th>
                                    <th>Representation</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr>
                                    <td colspan="4" style="text-align: center; color: #5a6270;">No data available</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <button class="btn btn-share" onclick="shareChart()">📤 Share Analysis</button>
            </div>
        </div>
    </div>

    <script>
        let friends = [];
        let chart = null;
        let multiracialComponents = [];

        const colorPalette = [
            '#00d4ff', '#0099ff', '#2fb17a', '#f5a623', '#f55656',
            '#9b59b6', '#1abc9c', '#e74c3c', '#3498db', '#95a5a6'
        ];

        const raceOptions = [
            'Asian',
            'Black/African American',
            'Hispanic/Latino',
            'White/Caucasian',
            'Middle Eastern/North African',
            'Native American/Indigenous',
            'Pacific Islander',
            'Other'
        ];

        function updateDate() {
            const now = new Date();
            const options = { month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', options);
        }

        function handleRaceChange() {
            const race = document.getElementById('friendRace').value;
            const multiracialSection = document.getElementById('multiracialSection');
            
            if (race === 'Multiracial') {
                multiracialSection.style.display = 'block';
                if (multiracialComponents.length === 0) {
                    addRaceComponent();
                    addRaceComponent();
                }
            } else {
                multiracialSection.style.display = 'none';
                multiracialComponents = [];
                document.getElementById('multiracialInputs').innerHTML = '';
            }
        }

        function addRaceComponent() {
            const id = Date.now() + Math.random();
            multiracialComponents.push({ id, race: '', percentage: '' });
            renderMultiracialInputs();
        }

        function removeRaceComponent(id) {
            multiracialComponents = multiracialComponents.filter(c => c.id !== id);
            renderMultiracialInputs();
        }

        function updateRaceComponent(id, field, value) {
            const component = multiracialComponents.find(c => c.id === id);
            if (component) {
                component[field] = value;
            }
        }

        function renderMultiracialInputs() {
            const container = document.getElementById('multiracialInputs');
            container.innerHTML = multiracialComponents.map(comp => `
                <div class="multiracial-component">
                    <select onchange="updateRaceComponent(${comp.id}, 'race', this.value)">
                        <option value="">Select race</option>
                        ${raceOptions.map(race => `
                            <option value="${race}" ${comp.race === race ? 'selected' : ''}>${race}</option>
                        `).join('')}
                    </select>
                    <input type="number" 
                           placeholder="%" 
                           min="0" 
                           max="100" 
                           value="${comp.percentage}"
                           onchange="updateRaceComponent(${comp.id}, 'percentage', this.value)" />
                    <button class="btn-remove-component" onclick="removeRaceComponent(${comp.id})">×</button>
                </div>
            `).join('');
        }

        function addFriend() {
            const name = document.getElementById('friendName').value.trim();
            const race = document.getElementById('friendRace').value;

            if (!name || !race) {
                return;
            }

            if (race === 'Multiracial') {
                // Validate multiracial components
                const validComponents = multiracialComponents.filter(c => c.race && c.percentage);
                
                if (validComponents.length === 0) {
                    alert('Please specify at least one racial component with percentage');
                    return;
                }

                const totalPercentage = validComponents.reduce((sum, c) => sum + parseFloat(c.percentage), 0);
                
                if (Math.abs(totalPercentage - 100) > 0.1) {
                    alert(`Percentages must add up to 100% (currently ${totalPercentage.toFixed(1)}%)`);
                    return;
                }

                // Store multiracial breakdown
                friends.push({
                    name,
                    race: 'Multiracial',
                    breakdown: validComponents.map(c => ({
                        race: c.race,
                        percentage: parseFloat(c.percentage) / 100
                    }))
                });

                // Reset multiracial inputs
                multiracialComponents = [];
                document.getElementById('multiracialInputs').innerHTML = '';
                document.getElementById('multiracialSection').style.display = 'none';
            } else {
                friends.push({ name, race });
            }

            document.getElementById('friendName').value = '';
            document.getElementById('friendRace').value = '';
            
            updateDisplay();
        }

        function removeFriend(index) {
            friends.splice(index, 1);
            updateDisplay();
        }

        function updateDisplay() {
            updateFriendsList();
            updateChart();
            updateStats();
            updateTable();
        }

        function updateFriendsList() {
            const listContainer = document.getElementById('friendsList');
            
            if (friends.length === 0) {
                listContainer.innerHTML = '';
                return;
            }

            listContainer.innerHTML = friends.map((friend, index) => {
                let raceDisplay = friend.race;
                if (friend.breakdown) {
                    raceDisplay = friend.breakdown
                        .map(b => `${(b.percentage * 100).toFixed(0)}% ${b.race}`)
                        .join(', ');
                }
                
                return `
                    <div class="friend-item">
                        <div class="friend-info">
                            <div class="friend-name">${friend.name}</div>
                            <div class="friend-race">${raceDisplay}</div>
                        </div>
                        <button class="btn btn-danger" onclick="removeFriend(${index})">Remove</button>
                    </div>
                `;
            }).join('');
        }

        function calculateRaceDistribution() {
            const raceCounts = {};
            
            friends.forEach(friend => {
                if (friend.breakdown) {
                    // Distribute multiracial person proportionally
                    friend.breakdown.forEach(component => {
                        raceCounts[component.race] = (raceCounts[component.race] || 0) + component.percentage;
                    });
                } else {
                    // Single race person counts as 1.0
                    raceCounts[friend.race] = (raceCounts[friend.race] || 0) + 1;
                }
            });
            
            return raceCounts;
        }

        function updateChart() {
            const canvas = document.getElementById('diversityChart');
            const ctx = canvas.getContext('2d');

            if (friends.length === 0) {
                if (chart) {
                    chart.destroy();
                    chart = null;
                }
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            const raceCounts = calculateRaceDistribution();

            const data = {
                labels: Object.keys(raceCounts),
                datasets: [{
                    data: Object.values(raceCounts),
                    backgroundColor: colorPalette,
                    borderWidth: 2,
                    borderColor: '#1a1f29'
                }]
            };

            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'doughnut',
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                color: '#d4d8dd',
                                padding: 16,
                                font: {
                                    size: 12,
                                    family: "'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
                                },
                                boxWidth: 12,
                                boxHeight: 12
                            }
                        },
                        tooltip: {
                            backgroundColor: '#1a1f29',
                            titleColor: '#e8ecf1',
                            bodyColor: '#d4d8dd',
                            borderColor: '#2d3544',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: true,
                            callbacks: {
                                label: function(context) {
                                    const label = context.label || '';
                                    const value = context.parsed || 0;
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = ((value / total) * 100).toFixed(1);
                                    return ` ${label}: ${value.toFixed(2)} (${percentage}%)`;
                                }
                            }
                        }
                    },
                    cutout: '60%'
                }
            });
        }

        function updateStats() {
            document.getElementById('totalFriends').textContent = friends.length;
            const raceCounts = calculateRaceDistribution();
            document.getElementById('uniqueGroups').textContent = Object.keys(raceCounts).length;
        }

        function updateTable() {
            const tableBody = document.getElementById('tableBody');
            
            if (friends.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #5a6270;">No data available</td></tr>';
                return;
            }

            const raceCounts = calculateRaceDistribution();
            const total = Object.values(raceCounts).reduce((a, b) => a + b, 0);
            const sortedRaces = Object.entries(raceCounts).sort((a, b) => b[1] - a[1]);

            tableBody.innerHTML = sortedRaces.map(([race, count]) => {
                const percentage = ((count / total) * 100).toFixed(1);
                const barWidth = percentage;
                
                return `
                    <tr>
                        <td>${race}</td>
                        <td><span class="count-badge">${count.toFixed(2)}</span></td>
                        <td><span class="percentage-badge">${percentage}%</span></td>
                        <td>
                            <div style="background: #2d3544; height: 6px; border-radius: 3px; overflow: hidden;">
                                <div style="background: #0099ff; height: 100%; width: ${barWidth}%; transition: width 0.3s;"></div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function shareChart() {
            if (friends.length === 0) {
                alert('Add contacts to network before exporting analysis');
                return;
            }

            const canvas = document.getElementById('diversityChart');
            
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve));
                const file = new File([blob], 'diversity-analysis.png', { type: 'image/png' });

                const raceCounts = calculateRaceDistribution();
                const total = Object.values(raceCounts).reduce((a, b) => a + b, 0);

                const statsText = `Friend Network Diversity Analysis\n\n` +
                    Object.entries(raceCounts)
                        .sort((a, b) => b[1] - a[1])
                        .map(([race, count]) => {
                            const percentage = ((count / total) * 100).toFixed(1);
                            return `${race}: ${count.toFixed(2)} (${percentage}%)`;
                        })
                        .join('\n') +
                    `\n\nTotal Contacts: ${friends.length}`;

                if (navigator.share && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: 'Friend Diversity Analysis',
                        text: statsText,
                        files: [file]
                    });
                } else {
                    const url = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.download = 'diversity-analysis.png';
                    link.href = url;
                    link.click();
                }
            } catch (error) {
                console.error('Error sharing:', error);
            }
        }

        document.getElementById('friendName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addFriend();
        });

        document.getElementById('friendRace').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (this.value !== 'Multiracial') {
                    addFriend();
                }
            }
        });

        updateDate();
        updateDisplay();
    </script>
</body>
</html>
